<!DOCTYPE html>
<html lang="en" data-theme="clear-day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>WeatherGPT — Ask what the weather means</title>
  <meta name="description" content="Personal weather intelligence for India: plain-language forecasts, best-time finder, route weather, live alerts and maps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Alumni+Sans:wght@200;300;400;600;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="src/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="src/config.js"></script>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="sky-demo-label" class="sky-demo" hidden></div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" id="brand" title="Triple-click for the sky time-lapse demo">
        <span class="logo" aria-hidden="true"><i></i><i></i></span>
        <div><b>WEATHERGPT</b><small>Ask what the weather means</small></div>
      </div>
      <div class="top-right">
        <div class="live-pill" id="live-pill" title="Data freshness"><i></i><span id="live-text">LIVE</span></div>
        <div id="google-signin-slot"></div>
      </div>
    </header>

    <button class="locbar" id="loc-btn" type="button" aria-haspopup="dialog">
      <span class="pin" aria-hidden="true">📍</span>
      <span class="loc-name" id="loc-name">Finding you…</span>
      <span class="loc-sub" id="loc-sub"></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>

    <div class="banner alert" id="alert-banner" hidden></div>
    <div class="banner warn" id="net-banner" hidden></div>

    <main class="views">
      <!-- CHAT -->
      <section class="view active" id="view-chat" aria-label="Chat">
        <div class="stream" id="stream"></div>
        <div class="dock">
          <div class="chips-head"><span class="live-dot"></span><span id="chips-label">Suggested for right now</span></div>
          <div class="chips" id="chips"></div>
          <form class="composer" id="composer" autocomplete="off">
            <button type="button" class="ic-btn" id="sky-photo-btn" title="Analyze a sky photo" aria-label="Analyze a sky photo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            </button>
            <input type="file" id="sky-file" accept="image/*" hidden>
            <input type="text" id="ask" placeholder="Ask anything… “best time to cycle tomorrow?”" aria-label="Ask WeatherGPT" enterkeyhint="send">
            <button type="button" class="ic-btn mic" id="mic-btn" title="Speak" aria-label="Speak your question">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button type="submit" class="send" id="send-btn" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </div>
        <div class="voice" id="voice" hidden>
          <button class="voice-close" id="voice-close" type="button" aria-label="Close voice mode">✕</button>
          <div class="orb-wrap"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><button class="orb" id="orb" type="button" aria-label="Tap to stop"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
          <div class="voice-status" id="voice-status">Listening…</div>
          <div class="voice-text" id="voice-text">Say something like “will it rain when I leave office?”</div>
          <div class="voice-lang" id="voice-lang"></div>
        </div>
      </section>

      <!-- ADVISORY -->
      <section class="view" id="view-advisory" aria-label="Advisory">
        <div class="persona-bar" id="persona-bar" role="tablist"></div>
        <div class="scroll" id="advisory-body"></div>
      </section>

      <!-- ALERTS -->
      <section class="view" id="view-alerts" aria-label="Alerts">
        <div class="scroll" id="alerts-body"></div>
      </section>

      <!-- MAP -->
      <section class="view" id="view-map" aria-label="Map">
        <div class="map-shell">
          <div id="map"></div>
          <div class="map-layers" id="map-layers" role="tablist"></div>
          <div class="map-legend" id="map-legend"></div>
          <div class="map-radar" id="map-radar" hidden>
            <button id="radar-play" type="button" aria-label="Play or pause radar">⏸</button>
            <span id="radar-time">Radar</span>
          </div>
          <div class="map-route" id="map-route" hidden></div>
          <div class="map-card" id="map-card" hidden></div>
        </div>
      </section>

      <!-- TRENDS -->
      <section class="view" id="view-trends" aria-label="Trends">
        <div class="scroll" id="trends-body"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Sections">
      <button class="tab active" data-tab="chat"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4A8 8 0 1 1 20 12z"/></svg><span>Chat</span></button>
      <button class="tab" data-tab="advisory"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Advisory</span></button>
      <button class="tab" data-tab="alerts"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg><span>Alerts</span><em class="tab-badge" id="alerts-badge" hidden>0</em></button>
      <button class="tab" data-tab="map"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></button>
      <button class="tab" data-tab="trends"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg><span>Trends</span></button>
    </nav>
  </div>

  <!-- Location picker -->
  <div class="sheet" id="loc-sheet" hidden role="dialog" aria-label="Choose location">
    <div class="sheet-card">
      <div class="sheet-head">
        <input type="text" id="loc-input" placeholder="Search a city or town…" autocomplete="off" spellcheck="false">
        <button type="button" id="loc-close" class="ic-btn" aria-label="Close">✕</button>
      </div>
      <button type="button" class="use-gps" id="use-gps"><span>🎯</span><div><b>Use my current location</b><small>Most accurate — uses your device GPS</small></div></button>
      <div class="sheet-list" id="loc-list"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
